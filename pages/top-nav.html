<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top Navigation</title>
<style>
  html,
  body {
    margin: 0;
    background: transparent;
    overflow: hidden;
  }

  .top-nav {
    background: rgba(0, 0, 0, 0.5);
    border-bottom: 3px solid #0f0;
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    width: 100%;
    min-height: 56px;
    box-sizing: border-box;
    padding: 4.5px 16px;
    color: #0f0;
    font: bold 20pt "Courier New", Courier, monospace;
  }

  .top-nav__site {
    display: flex;
    align-items: center;
    gap: 10px;
    color: inherit;
    text-decoration: none;
    white-space: nowrap;
  }

  .top-nav__site span,
  #top-nav-clock-time {
    text-decoration: underline;
  }

  .top-nav__contact {
    justify-self: center;
    color: inherit;
    text-decoration: underline;
  }

  .top-nav__site:hover,
  .top-nav__site:focus-visible,
  .top-nav__contact:hover,
  .top-nav__contact:focus-visible {
    color: #f0f;
  }

  .top-nav__avatar {
    display: block;
    flex-shrink: 0;
    box-sizing: border-box;
    width: 44px;
    height: 44px;
    border: 3px solid #0f0;
    border-radius: 50%;
    object-fit: cover;
  }

  .top-nav__clock {
    margin-left: auto;
    white-space: nowrap;
  }

  @media (max-width: 900px) {
    .top-nav {
      display: flex;
      gap: 8px;
      padding: 4.5px 8px;
      font-size: clamp(9px, 2vw, 20px);
    }

    .top-nav__site {
      gap: 6px;
    }
  }
</style>
</head>
<body>
  <nav class="top-nav" aria-label="Main navigation">
    <a class="top-nav__site" href="/" target="_top">
      <img class="top-nav__avatar" src="https://unavatar.io/youtube/honestly_thomas" alt="Honestly Thomas" width="44" height="44">
      <span>honestlythomas.com</span>
    </a>
    <a class="top-nav__contact" href="mailto:webmaster@theinternetisdead.org" target="_top">Contact</a>
    <time class="top-nav__clock" id="top-nav-clock" aria-label="Current Toronto time"><span id="top-nav-clock-icon" aria-hidden="true"></span> <span id="top-nav-clock-time"></span></time>
  </nav>
  <script>
    const clock = document.getElementById("top-nav-clock");
    const clockTime = document.getElementById("top-nav-clock-time");
    const clockIcon = document.getElementById("top-nav-clock-icon");
    const torontoClock = new Intl.DateTimeFormat("en-US", {
      timeZone: "America/Toronto",
      hour: "numeric",
      minute: "2-digit",
      second: "2-digit",
      hour12: true
    });

    function updateClock() {
      const now = new Date();
      const time = torontoClock.format(now);
      const parts = Object.fromEntries(
        torontoClock.formatToParts(now).map(part => [part.type, part.value])
      );
      const halfHour = Math.round((Number(parts.hour) % 12 * 60 + Number(parts.minute)) / 30) % 24;
      const hour = Math.floor(halfHour / 2);
      const faceOffset = (hour + 11) % 12;
      const faceBase = halfHour % 2 === 0 ? 0x1F550 : 0x1F55C;
      clockIcon.textContent = String.fromCodePoint(faceBase + faceOffset) + "\uFE0E";
      clockTime.textContent = time;
      clock.dateTime = now.toISOString();
      clock.setAttribute("aria-label", "Current Toronto time: " + time);
    }

    updateClock();
    setInterval(updateClock, 250);
  </script>
</body>
</html>
